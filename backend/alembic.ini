# Configuration Alembic.
#
# La chaîne de connexion N'EST PAS écrite ici : `migrations/env.py` la lit depuis
# `app.config.settings.DATABASE_URL` (variable d'environnement), ce qui évite de
# committer un DSN avec mot de passe.
#
# Usage :
#   alembic upgrade head                       # appliquer les migrations
#   alembic revision --autogenerate -m "..."   # créer une migration depuis les modèles
#   alembic stamp head                         # marquer un schéma existant comme à jour
#   alembic downgrade -1                       # revenir un cran en arrière

[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os
file_template = %%(rev)s_%%(slug)s
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
