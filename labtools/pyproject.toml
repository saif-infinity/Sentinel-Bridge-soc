[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "labtools"
version = "0.1.0"
description = "Boîte à outils de laboratoire : scénarios SOC, envoi HTTP et sondes réseau bornées"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "saif-infinity" }]
keywords = ["soc", "siem", "xdr", "lab", "testing", "syslog", "cef"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: System Administrators",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: System :: Logging",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9"]

[project.scripts]
labtools = "labtools.cli:main"

[project.urls]
Homepage = "https://github.com/saif-infinity/test-tools-collecter"
Issues = "https://github.com/saif-infinity/test-tools-collecter/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
labtools = ["data/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["labtools"]
