name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Installer ruff
        run: python -m pip install "ruff>=0.9"
      - name: Vérifier le style
        run: ruff check .

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Installer le paquet et les dépendances de test
        run: python -m pip install -e ".[dev]"
      - name: Exécuter la suite
        run: python -m pytest

  package:
    name: Construction du paquet
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Construire la distribution
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Vérifier l'inventaire embarqué
        run: |
          python -m pip install dist/*.whl
          labtools --version
          labtools catalog --search scapy
          labtools validate examples/custom-scenario.json
      - uses: actions/upload-artifact@v4
        with:
          name: distribution
          path: dist/
          if-no-files-found: error
