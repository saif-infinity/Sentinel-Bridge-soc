<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="850" viewBox="0 0 1280 850" role="img" aria-labelledby="title description">
  <title id="title">Du problème au bénéfice attendu</title>
  <desc id="description">Cinq liens qualitatifs entre un problème SOC, un mécanisme du code et son apport attendu. Ces bénéfices ne sont pas des résultats chiffrés : logs dispersés vers lecture cohérente, répétitions vers déduplication, contexte éparpillé vers dossier partagé, actions vers contrôle, évolutions en silos vers couches et tests.</desc>
