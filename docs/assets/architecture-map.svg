<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1090" viewBox="0 0 1280 1090" role="img" aria-labelledby="title description">
  <title id="title">Carte logique des composants</title>
  <desc id="description">Les interfaces SOC et admin et les webhooks Wazuh/Suricata utilisent le processus FastAPI. Le backend contient les contrôles d’accès, le pipeline et le bus local avec les modules métier. PostgreSQL conserve les données. Redis transporte les jobs Celery et les Streams syslog. Le récepteur syslog est séparé. Les playbooks directs utilisent des threads du processus appelant. Les services de TI, IA, notification et réponse sont optionnels et exigent leur configuration.</desc>
