      <text x="197" y="253" fill="#94a3b8">/</text>
      <text x="225" y="253" fill="#6ee7b7">CORRÉLER</text>
      <text x="362" y="253" fill="#94a3b8">/</text>
      <text x="390" y="253" fill="#6ee7b7">INVESTIGUER</text>
      <text x="558" y="253" fill="#94a3b8">/</text>
      <text x="586" y="253" fill="#6ee7b7">RÉPONDRE</text>
